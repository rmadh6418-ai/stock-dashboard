name: Daily Dashboard Update

on:
  push:
    branches: [ main ]
    paths:
      - 'build_page.py'
      - '.github/workflows/update.yml'
  schedule:
    # 장중 15분마다 실행 (한국시간 09:05 ~ 14:50)
    - cron: '5,20,35,50 0-5 * * 1-5'
    # 장 마감 시간대 (한국시간 15:05, 15:20, 15:35)
    - cron: '5,20,35 6 * * 1-5'
  workflow_dispatch:

concurrency:
  group: stock-dashboard-update
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Python script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          DASHBOARD_PW: ${{ secrets.DASHBOARD_PW }}
        run: python build_page.py

      - name: Update Kakao Secret (If Renewed)
        if: env.NEW_KAKAO_TOKEN != ''
        run: |
          gh secret set KAKAO_REFRESH_TOKEN -b"${{ env.NEW_KAKAO_TOKEN }}"
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html ai_summary_cache.json
          git commit -m "업데이트: 실시간 데이터 및 AI 분석 반영" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push origin main || true

      # 변경된 Source 설정에 맞춰 봇이 직접 GitHub Pages로 웹사이트를 쏴주는 배포 단계
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
