name: Daily Dashboard Update

on:
  push:
    branches: [ main ]
    paths:
      - 'build_page.py'
      - '.github/workflows/update.yml'
  schedule:
    # 평일 한국시간 09:05 ~ 14:50 사이 15분마다 장중 자동 업데이트 (UTC 00:05 ~ 05:50)
    - cron: '5,20,35,50 0-5 * * 1-5'
    # 평일 한국시간 15:05, 15:20 장중 업데이트 및 15:35 정규장 마감 리포트/카톡 발송 (UTC 06:05, 06:20, 06:35)
    - cron: '5,20,35 6 * * 1-5'
  workflow_dispatch:

concurrency:
  group: stock-dashboard-update
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Python script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          DASHBOARD_PW: ${{ secrets.DASHBOARD_PW }}
        run: python build_page.py

      - name: Update Kakao Secret (If Renewed)
        if: env.NEW_KAKAO_TOKEN != ''
        run: |
          gh secret set KAKAO_REFRESH_TOKEN -b"${{ env.NEW_KAKAO_TOKEN }}"
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}

      - name: Commit and Push changes
        env:
          GH_TOKEN: ${{ secrets.MY_PAT || github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cp index.html /tmp/index.html
          if [ -f ai_summary_cache.json ]; then cp ai_summary_cache.json /tmp/ai_summary_cache.json; fi
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/index.html index.html
          if [ -f /tmp/ai_summary_cache.json ]; then cp /tmp/ai_summary_cache.json ai_summary_cache.json; fi
          git add index.html ai_summary_cache.json
          git commit -m "업데이트: 실시간 금융 데이터 반영" || echo "No changes to commit"
          git push origin main

      # 기존 deploy.yml이 하던 웹사이트 실제 반영(GitHub Pages 배포) 단계 통합
      - name: Setup Pages
        uses: actions/configure-pages@v4
        continue-on-error: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
